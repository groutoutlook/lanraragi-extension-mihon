name: Check Personal LANraragi
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Format, build, and lint
        shell: pwsh
        run: |
          chmod +x ./gradlew
          if ($LASTEXITCODE -ne 0) { throw 'Could not make Gradle executable.' }
          ./gradlew spotlessApply
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed.' }
          ./gradlew :src:all:lanraragi:assembleDebug :src:all:lanraragi:lintRelease
          if ($LASTEXITCODE -ne 0) { throw 'Build or release lint failed.' }
